name: Prepare security dependency lock
on:
  push:
    branches: [ci/dependency-security-lock]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Generate the coherent patched workspace lock
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          npm update vite postcss source-map-js nanoid smol-toml zod --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Install and audit the complete dependency tree
        run: |
          set -euo pipefail
          npm ci --no-fund --no-audit
          npm audit --json | tee application-audit.json
          npm ls --all --json > dependency-tree.json
      - name: Check compiler and Workers type compatibility
        run: npm run typecheck
      - name: Check Wrangler types and dry-run compatibility
        run: |
          npm run cf-types
          npm run dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mesh-security-lock
          path: |
            package.json
            packages/router-worker/package.json
            package-lock.json
            application-audit.json
            dependency-tree.json
          if-no-files-found: error
          retention-days: 1
