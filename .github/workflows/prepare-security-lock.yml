name: Normalize patched Go module
on:
  push:
    branches: [ci/dependency-security-lock]
permissions:
  contents: read
jobs:
  module:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/node-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d9286ebd03a2d1c5a36f97613e2e2eb7eef48ad9
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: packages/node-agent/go.mod
      - name: Produce canonical module metadata
        run: |
          go mod tidy
          git diff -- go.mod
      - name: Verify node-agent behavior and vulnerability state
        run: |
          set -euo pipefail
          go test ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./... | tee govulncheck.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mesh-canonical-go-module
          path: |
            packages/node-agent/go.mod
            packages/node-agent/go.sum
            packages/node-agent/govulncheck.txt
          if-no-files-found: error
          retention-days: 1
