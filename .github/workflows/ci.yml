name: PR Checks
# REL001PullRequestChecks
# REL003PackageSmoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and dead-code checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Dead code and dependency check
        run: npm run knip

  router:
    name: Router Worker checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Test router behavior
        run: npm run test --workspace packages/router-worker
      - name: Type-check router
        run: npm run typecheck --workspace packages/router-worker
      - name: Generate Wrangler types
        run: npm run cf-types --workspace packages/router-worker
      - name: Worker dry-run deploy
        run: npm run dry-run --workspace packages/router-worker

  agent:
    name: Node agent checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/node-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: packages/node-agent/go.mod
      - name: Go test
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Go race tests
        run: go test -race ./...
      - name: Build command
        run: go build ./cmd/inference-mesh-agent

  packaging:
    name: Package smoke artifact
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/node-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: packages/node-agent/go.mod
      - name: Build staged binary
        run: mkdir -p dist && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=ci" -o dist/inference-mesh-agent-linux-amd64 ./cmd/inference-mesh-agent
      - name: Create archive and checksums
        run: |
          tar -C dist -czf dist/inference-mesh-agent-linux-amd64.tar.gz inference-mesh-agent-linux-amd64
          sha256sum dist/inference-mesh-agent-linux-amd64.tar.gz > dist/checksums.txt
          sha256sum -c dist/checksums.txt
      - name: Version command
        run: ./dist/inference-mesh-agent-linux-amd64 version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inference-mesh-agent-linux-amd64
          path: packages/node-agent/dist/*

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1

  vulnerability-checks:
    name: Vulnerability checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: packages/node-agent/go.mod
      - name: npm audit
        run: npm ci && npm audit --audit-level=high
      - name: Go vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          cd packages/node-agent
          govulncheck ./...

  test:
    name: test
    runs-on: ubuntu-24.04
    needs: [quality, router, agent, packaging, dependency-review, vulnerability-checks]
    if: always()
    steps:
      - name: Require required checks
        run: |
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.router.result }}" = "success"
          test "${{ needs.agent.result }}" = "success"
          test "${{ needs.packaging.result }}" = "success"
          test "${{ needs.vulnerability-checks.result }}" = "success"
          case "${{ needs.dependency-review.result }}" in success|skipped) exit 0 ;; *) exit 1 ;; esac
